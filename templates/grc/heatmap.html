<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>خريطة حرارة المخاطر | SIEM GRC</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #0a0e14;
            font-family: Arial;
            color: white;
            padding: 20px;
        }
        
        h2 {
            margin-bottom: 20px;
        }
        
        .heatmap-wrapper {
            display: flex;
            gap: 15px;
        }
        
        .y-axis {
            display: grid;
            grid-template-rows: repeat(5, 120px);
            color: #80b7ff;
            font-weight: bold;
        }
        
        .x-axis {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            text-align: center;
            color: #80b7ff;
            margin-bottom: 10px;
            font-weight: bold;
        }
        
        .heatmap-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }
        
        .cell {
            min-height: 120px;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px;
        }
        
        .cell:hover {
            transform: scale(1.05);
        }
        
        .score {
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .risk {
            font-size: 11px;
            text-align: center;
        }
        
        .badge {
            background: rgba(0, 0, 0, 0.4);
            padding: 3px 6px;
            border-radius: 6px;
            font-size: 10px;
            margin-top: 4px;
        }
    </style>
</head>

<body>

    <h2>🔥 خريطة حرارة المخاطر (SOC View)</h2>

    <!-- DATA -->
    <div id="risk-data" data-json='{{ risks | tojson | safe }}'></div>

    <div class="heatmap-wrapper">

        <div class="y-axis">
            <div>5</div>
            <div>4</div>
            <div>3</div>
            <div>2</div>
            <div>1</div>
        </div>

        <div>

            <div class="x-axis">
                <div>1</div>
                <div>2</div>
                <div>3</div>
                <div>4</div>
                <div>5</div>
            </div>

            <div class="heatmap-grid" id="heatmap"></div>

        </div>

    </div>

    <script>
        const risks = JSON.parse(document.getElementById("risk-data").dataset.json || "[]");

        function getColor(score) {
            if (score >= 20) return '#b91c1c';
            if (score >= 12) return '#e67e22';
            if (score >= 6) return '#f1c40f';
            return '#2ecc71';
        }

        const heatmap = document.getElementById("heatmap");

        for (let l = 5; l >= 1; l--) {
            for (let i = 1; i <= 5; i++) {

                const score = l * i;

                const cell = document.createElement("div");
                cell.className = "cell";
                cell.style.background = getColor(score);

                const scoreDiv = document.createElement("div");
                scoreDiv.className = "score";
                scoreDiv.innerText = "Score " + score;

                cell.appendChild(scoreDiv);

                risks.forEach(r => {
                    if (r.likelihood === l && r.impact === i) {

                        const div = document.createElement("div");
                        div.className = "risk";

                        div.innerHTML = `
                    ⚠️ ${r.title}<br>
                    <span class="badge">${r.category}</span>
                `;

                        cell.appendChild(div);
                    }
                });

                heatmap.appendChild(cell);
            }
        }
    </script>

</body>

</html>
