<!DOCTYPE html>
<html lang="ar">

<head>
    <meta charset="UTF-8">
    <title>إضافة سجل يدوي</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            background: #0a0e14;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }
        
        .card {
            background: #11161f;
            border-radius: 32px;
            padding: 2rem;
            max-width: 700px;
            width: 100%;
            border: 1px solid #2e3a48;
        }
        
        input,
        select,
        textarea {
            width: 100%;
            background: #1a212c;
            border: 1px solid #2e3a48;
            padding: 0.7rem;
            border-radius: 24px;
            margin-bottom: 1rem;
            color: white;
        }
        
        label {
            font-size: 0.8rem;
            font-weight: 500;
            display: block;
            margin-bottom: 0.3rem;
        }
        
        button {
            background: #0f6bff;
            width: 100%;
            padding: 0.7rem;
            border-radius: 40px;
            border: none;
            font-weight: bold;
            color: white;
        }
    </style>
</head>

<body>
    <div class="card">
        <h2><i class="fas fa-pen-alt"></i> إضافة Log يدوي</h2>
        {% if success %}
        <div style="background:#0f2b1f; padding:0.8rem; border-radius:20px; margin-bottom:1rem;">✅ تم إضافة log من IP {{ log.src_ip }}</div>{% endif %}
        <form method="POST">
            <label>IP المصدر *</label><input name="src_ip" required>
            <label>المستخدم</label><input name="username">
            <label>نوع الحدث</label><input name="event_type" value="login">
            <label>الحالة</label><select name="status"><option>success</option><option>failed</option></select>
            <label>المسار (مثال /login)</label><input name="request_path">
            <label>الطريقة (GET/POST)</label><input name="method">
            <label>التفاصيل</label><textarea name="details" rows="2"></textarea>
            <button type="submit"><i class="fas fa-save"></i> إرسال</button>
        </form>
    </div>
</body>

</html>
