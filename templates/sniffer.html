<!DOCTYPE html>
<html lang="ar">

<head>
    <meta charset="UTF-8">
    <title>Sniffer فوري - مراقبة الشبكة</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            background: #0a0e14;
            font-family: 'Inter', sans-serif;
            color: #eef2ff;
            direction: rtl;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: auto;
        }
        
        .controls {
            background: #11161f;
            border-radius: 28px;
            padding: 1rem;
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            align-items: center;
            flex-wrap: wrap;
        }
        
        button {
            background: #0f6bff;
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        
        button.stop {
            background: #b91c1c;
        }
        
        input,
        select {
            background: #1a212c;
            border: 1px solid #2e3a48;
            padding: 8px 15px;
            border-radius: 40px;
            color: white;
        }
        
        .packets {
            background: #0f131c;
            border-radius: 24px;
            overflow-x: auto;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th,
        td {
            padding: 12px;
            text-align: right;
            border-bottom: 1px solid #1f2a3a;
        }
        
        th {
            background: #0b0f17;
            color: #80b7ff;
        }
        
        .status-badge {
            display: inline-block;
            background: #2c3e50;
            border-radius: 20px;
            font-size: 12px;
            padding: 2px 8px;
        }
        
        .active {
            background: #2ecc71;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1><i class="fas fa-broadcast-tower"></i> مراقبة الشبكة فورية (Sniffer)</h1>
        <div class="controls">
            <button id="startBtn" class="start"><i class="fas fa-play"></i> بدء المراقبة</button>
            <button id="stopBtn" class="stop"><i class="fas fa-stop"></i> إيقاف المراقبة</button>
            <label>واجهة الشبكة (اختياري):</label>
            <input type="text" id="interface" placeholder="eth0, wlan0, ...">
            <span id="statusSpan" class="status-badge">متوقف</span>
        </div>
        <div class="packets">
            <table id="packetsTable">
                <thead>
                    <tr>
                        <th>التوقيت</th>
                        <th>IP المصدر</th>
                        <th>البروتوكول</th>
                        <th>التفاصيل</th>
                    </tr>
                </thead>
                <tbody id="packetsBody">
                    <tr>
                        <td colspan="4">اضغط "بدء المراقبة" لبدء التقاط الحزم</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <script>
        const socket = io();
        const tableBody = document.getElementById('packetsBody');
        socket.on('new_packet', (packet) => {
            const row = `<tr>
            <td>${packet.timestamp}</td>
            <td><code>${packet.src_ip}</code></td>
            <td>${packet.protocol}</td>
            <td style="max-width:500px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${packet.details}</td>
        </tr>`;
            tableBody.insertAdjacentHTML('afterbegin', row);
            if (tableBody.rows.length > 100) tableBody.deleteRow(-1);
        });
        document.getElementById('startBtn').onclick = async() => {
            const interfaceVal = document.getElementById('interface').value;
            const res = await fetch('/start_sniffer', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    interface: interfaceVal || null
                })
            });
            const data = await res.json();
            if (res.ok) {
                document.getElementById('statusSpan').innerHTML = 'يعمل الآن';
                document.getElementById('statusSpan').classList.add('active');
                tableBody.innerHTML = '<tr><td colspan="4">جارٍ التقاط الحزم...</td></tr>';
            } else alert(data.status);
        };
        document.getElementById('stopBtn').onclick = async() => {
            const res = await fetch('/stop_sniffer', {
                method: 'POST'
            });
            if (res.ok) {
                document.getElementById('statusSpan').innerHTML = 'متوقف';
                document.getElementById('statusSpan').classList.remove('active');
            } else alert('توقف غير متوقع');
        };
        fetch('/sniffer_status').then(r => r.json()).then(data => {
            if (data.active) {
                document.getElementById('statusSpan').innerHTML = 'يعمل الآن';
                document.getElementById('statusSpan').classList.add('active');
            }
        });
    </script>
</body>

</html>
