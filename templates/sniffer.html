<!DOCTYPE html>
<html lang="ar">

<head>
    <meta charset="UTF-8">
    <title>Sniffer – مراقبة الشبكة</title>
    <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
    <style>
        body {
            background: #0a0e14;
            color: #eef2ff;
            font-family: monospace;
            padding: 2rem;
        }
        
        .controls {
            margin-bottom: 1rem;
        }
        
        button {
            background: #0f6bff;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 30px;
            color: white;
            cursor: pointer;
            margin: 0 0.5rem;
        }
        
        .stop-btn {
            background: #b91c1c;
        }
        
        .status {
            display: inline-block;
            margin-left: 1rem;
            font-weight: bold;
        }
        
        .active {
            color: #2ecc71;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            background: #11161f;
        }
        
        th,
        td {
            border: 1px solid #2a3240;
            padding: 0.5rem;
            text-align: left;
        }
        
        th {
            background: #0b0f17;
        }
        
        select,
        input {
            background: #1e2a3a;
            color: white;
            padding: 0.4rem;
            border-radius: 8px;
            border: 1px solid #2ecc71;
            margin: 0 0.5rem;
        }
        
        #counter {
            color: #f39c12;
            margin-left: 1rem;
        }
    </style>
</head>

<body>
    <h2>📡 Sniffer – الحزم الملتقطة (Batch Mode)</h2>
    <div class="controls">
        <select id="interfaceSelect"><option value="">-- تحميل الواجهات... --</option></select>
        <button id="startBtn">▶ بدء Sniffer</button>
        <button id="stopBtn" class="stop-btn">⏹ إيقاف Sniffer</button>
        <span id="snifferStatus" class="status">⏸ متوقف</span>
        <span id="counter">الباكيتس: 0</span>
    </div>
    <div style="overflow-x:auto; max-height:600px; overflow-y:auto;">
        <table id="packetsTable">
            <thead>
                <tr>
                    <th>التوقيت</th>
                    <th>المصدر</th>
                    <th>البروتوكول</th>
                    <th>الحجم</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
    <script>
        const socket = io();
        const tableBody = document.getElementById('tableBody');
        const statusSpan = document.getElementById('snifferStatus');
        const counterSpan = document.getElementById('counter');
        const interfaceSelect = document.getElementById('interfaceSelect');
        let packetCount = 0;
        const MAX_ROWS = 200;

        socket.on('new_packet_batch', (packets) => {
            packets.forEach(p => {
                packetCount++;
                counterSpan.textContent = 'الباكيتس: ' + packetCount;
                const row = document.createElement('tr');
                row.innerHTML = `<td>${p.timestamp}</td><td>${p.src_ip}</td><td>${p.protocol}</td><td>${p.size} bytes</td>`;
                tableBody.insertBefore(row, tableBody.firstChild);
                while (tableBody.rows.length > MAX_ROWS) tableBody.deleteRow(tableBody.rows.length - 1);
            });
        });

        async function loadInterfaces() {
            const res = await fetch('/network_interfaces');
            const ifaces = await res.json();
            interfaceSelect.innerHTML = '<option value="">-- كل الواجهات --</option>';
            ifaces.forEach(iface => {
                const opt = document.createElement('option');
                opt.value = iface;
                opt.textContent = iface;
                interfaceSelect.appendChild(opt);
            });
        }

        async function updateStatus() {
            const res = await fetch('/sniffer_status');
            const data = await res.json();
            if (data.active) {
                statusSpan.textContent = '✅ يعمل';
                statusSpan.classList.add('active');
            } else {
                statusSpan.textContent = '⏸ متوقف';
                statusSpan.classList.remove('active');
            }
        }

        document.getElementById('startBtn').onclick = async() => {
            const iface = interfaceSelect.value;
            await fetch('/start_sniffer', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    interface: iface || null
                })
            });
            updateStatus();
        };
        document.getElementById('stopBtn').onclick = async() => {
            await fetch('/stop_sniffer', {
                method: 'POST'
            });
            updateStatus();
        };

        loadInterfaces();
        updateStatus();
        setInterval(updateStatus, 3000);
    </script>
</body>

</html>
