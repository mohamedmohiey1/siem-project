<!DOCTYPE html>
<html lang="ar">

<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول - SIEM</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            background: linear-gradient(145deg, #32353a, #353536);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 2rem;
        }
        
        .login-card {
            background: #343639;
            border-radius: 32px;
            padding: 2rem;
            max-width: 400px;
            width: 100%;
            border: 1px solid #2e3a48;
        }
        
        h2 {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        
        input {
            width: 100%;
            background: #454950;
            border: 1px solid #2b323a;
            padding: 0.7rem;
            border-radius: 24px;
            margin-bottom: 1rem;
            color: white;
        }
        
        button {
            background: #0f6bff;
            width: 100%;
            padding: 0.7rem;
            border-radius: 40px;
            border: none;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        
        .flash {
            background: #b91c1c;
            padding: 0.5rem;
            border-radius: 20px;
            margin-bottom: 1rem;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <h2><i class="fas fa-shield-alt"></i> تسجيل الدخول</h2>
        {% with messages = get_flashed_messages() %} {% if messages %}
        <div class="flash">{{ messages[0] }}</div>
        {% endif %} {% endwith %}
        <form method="POST">
            <input type="text" name="username" placeholder="اسم المستخدم" required>
            <input type="password" name="password" placeholder="كلمة المرور" required>
            <button type="submit">دخول</button>
        </form>
    </div>
</body>

</html>
