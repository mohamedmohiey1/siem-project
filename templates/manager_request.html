<!DOCTYPE html>
<html lang="ar">

<head>
    <meta charset="UTF-8">
    <title>طلب تحليل جديد - SIEM</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            background: #0a0e14;
            font-family: 'Inter', sans-serif;
            padding: 2rem;
            direction: rtl;
            color: #eef2ff;
        }
        
        .card {
            background: #11161f;
            border-radius: 32px;
            padding: 2rem;
            max-width: 600px;
            margin: auto;
        }
        
        input,
        textarea {
            width: 100%;
            background: #1a212c;
            border: 1px solid #2e3a48;
            padding: 0.7rem;
            border-radius: 24px;
            margin-bottom: 1rem;
            color: white;
        }
        
        button {
            background: #0f6bff;
            padding: 0.7rem;
            border-radius: 40px;
            border: none;
            color: white;
            cursor: pointer;
        }
        
        .flash {
            background: #b91c1c;
            padding: 0.5rem;
            border-radius: 20px;
            margin-bottom: 1rem;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="card">
        <h2><i class="fas fa-paper-plane"></i> إرسال طلب تحليل إلى المسؤول</h2>
        {% with messages = get_flashed_messages() %}{% if messages %}
        <div class="flash">{{ messages[0] }}</div>{% endif %}{% endwith %}
        <form method="POST" enctype="multipart/form-data">
            <label>الملف (log, txt, csv)</label>
            <input type="file" name="file" accept=".log,.txt,.csv" required>
            <label>وصف الطلب (اختياري)</label>
            <textarea name="request_message" rows="3" placeholder="مثال: يرجى تحليل هذا الملف والبحث عن هجمات brute force"></textarea>
            <button type="submit"><i class="fas fa-send"></i> إرسال الطلب</button>
        </form>
        <div style="margin-top:1rem"><a href="/manager/requests" style="color:#80b7ff;">← طلباتي</a></div>
    </div>
</body>

</html>
