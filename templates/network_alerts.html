<!DOCTYPE html>
<html lang="ar">

<head>
    <meta charset="UTF-8">
    <title>تنبيهات الشبكة المتقدمة</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            background: #0a0e14;
            font-family: 'Inter', sans-serif;
            padding: 2rem;
            direction: rtl;
            color: #eef2ff;
        }
        
        .container {
            max-width: 1200px;
            margin: auto;
        }
        
        .badge-crit {
            background: #b91c1c;
        }
        
        .badge-high {
            background: #e67e22;
        }
        
        .badge-medium {
            background: #f1c40f;
            color: #1e1e2f;
        }
        
        .badge-low {
            background: #2980b9;
        }
        
        table {
            width: 100%;
            background: #0f131c;
            border-radius: 24px;
            overflow: hidden;
            border-collapse: collapse;
        }
        
        th,
        td {
            padding: 1rem;
            border-bottom: 1px solid #1f2a3a;
            text-align: right;
        }
        
        th {
            background: #0b0f17;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1><i class="fas fa-shield-virus"></i> تنبيهات أمن الشبكة</h1>
        <table>
            <thead>
                <tr>
                    <th>التوقيت</th>
                    <th>الخطورة</th>
                    <th>النوع</th>
                    <th>IP المصدر</th>
                    <th>الوصف</th>
                </tr>
            </thead>
            <tbody>{% for a in alerts %}
                <td>{{ a.timestamp.strftime('%Y-%m-%d %H:%M:%S') }}</td>
                <td><span class="badge-{{ a.severity.lower() }}">{{ a.severity }}</span></td>
                <td>{{ a.alert_type }}</td>
                <td><code>{{ a.src_ip or '-' }}</code></td>
                <td>{{ a.description }}</td>
                </tr>{% else %}
                <td colspan="5">لا توجد تنبيهات شبكة متقدمة</td>
                </td>{% endfor %}</tbody>
        </table>
    </div>
</body>

</html>
